name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Toolchain
        run: |
          swift --version
          xcrun --show-sdk-version

      - name: Run Unit Tests
        run: swift test --parallel

      - name: Build Release Binary
        run: swift build -c release

      - name: Assemble App Bundle (Ad-hoc)
        run: INSTALL_TO_APPLICATIONS=0 SIGN_IDENTITY="-" ./Scripts/build_app.sh
