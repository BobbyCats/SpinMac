name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Toolchain
        run: |
          swift --version
          xcrun --show-sdk-version

      - name: Run Unit Tests
        run: swift test --parallel

      - name: Package Universal DMG (arm64 + x86_64, Ad-hoc)
        run: |
          chmod +x Scripts/*.sh
          SKIP_TESTS=1 UNIVERSAL=1 SIGN_IDENTITY="-" ./Scripts/package_dmg.sh
          ls -lh dist/*.dmg
