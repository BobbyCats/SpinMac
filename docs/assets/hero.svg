<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-label="SpinMac — Native macOS Display and Trackpad Rotation">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1018"/>
      <stop offset="55%" stop-color="#101827"/>
      <stop offset="100%" stop-color="#0A131C"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="0.22" cy="0.25" r="0.55">
      <stop offset="0%" stop-color="#2D7FF9" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#2D7FF9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowTeal" cx="0.82" cy="0.72" r="0.5">
      <stop offset="0%" stop-color="#1FD1C2" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#1FD1C2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="iconBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#242C3A"/>
      <stop offset="100%" stop-color="#11151E"/>
    </linearGradient>
    <linearGradient id="screenFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#1D4ED8" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="padFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2DD4BF" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#0D9488" stop-opacity="0.10"/>
    </linearGradient>
    <linearGradient id="cardGlass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.03"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Canvas Backdrop -->
  <rect width="1200" height="440" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="440" rx="28" fill="url(#grid)"/>
  <rect width="1200" height="440" rx="28" fill="url(#glowBlue)"/>
  <rect width="1200" height="440" rx="28" fill="url(#glowTeal)"/>
  <rect x="1" y="1" width="1198" height="438" rx="27" fill="none" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="1.2"/>

  <!-- Left Column: Brand & Pitch -->
  <g transform="translate(68, 74)">
    <!-- App Icon -->
    <g>
      <rect width="74" height="74" rx="18" fill="url(#iconBg)" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="1.2"/>
      <rect x="26" y="21" width="22" height="32" rx="4" fill="#3B82F6" fill-opacity="0.25" stroke="#F8FAFC" stroke-width="2.4"/>
      <path d="M 61 28 A 25 25 0 0 0 29 13" fill="none" stroke="#4598FF" stroke-width="2.8" stroke-linecap="round"/>
      <path d="M 13 46 A 25 25 0 0 0 45 61" fill="none" stroke="#2DD4BF" stroke-width="2.8" stroke-linecap="round"/>
    </g>

    <!-- Title -->
    <text x="94" y="42" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif" font-size="44" font-weight="700" letter-spacing="-1.2">SpinMac</text>
    <text x="96" y="68" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif" font-size="16" font-weight="500">v0.2.1 · Native macOS Menu Bar Utility</text>

    <!-- Hero Headline -->
    <text x="0" y="138" fill="#F1F5F9" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif" font-size="30" font-weight="600" letter-spacing="-0.6">Rotate your MacBook screen &amp; trackpad</text>
    <text x="0" y="176" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif" font-size="22" font-weight="400">— linked together, or completely independent.</text>

    <!-- Feature Pills -->
    <g transform="translate(0, 214)">
      <rect width="128" height="32" rx="16" fill="#3B82F6" fill-opacity="0.16" stroke="#60A5FA" stroke-opacity="0.4"/>
      <circle cx="18" cy="16" r="4" fill="#60A5FA"/>
      <text x="30" y="21" fill="#DBEAFE" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="13" font-weight="600">Built-in 270°</text>

      <rect x="140" width="160" height="32" rx="16" fill="#14B8A6" fill-opacity="0.16" stroke="#2DD4BF" stroke-opacity="0.4"/>
      <circle cx="158" cy="16" r="4" fill="#2DD4BF"/>
      <text x="170" y="21" fill="#CCFBF1" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="13" font-weight="600">Full Gesture Parity</text>

      <rect x="312" width="132" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.16"/>
      <circle cx="330" cy="16" r="4" fill="#4ADE80"/>
      <text x="342" y="21" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="13" font-weight="600">0% Idle CPU</text>
    </g>

    <!-- Hotkey Cue -->
    <g transform="translate(0, 268)">
      <text x="0" y="18" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="13" font-weight="500">Default global hotkey:</text>
      <rect x="146" y="0" width="76" height="26" rx="7" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.16"/>
      <text x="184" y="17.5" text-anchor="middle" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'SF Mono', monospace" font-size="12.5" font-weight="600">⌃⌥⌘R</text>
      <text x="236" y="18" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="13" font-weight="500">+ 10s safety rollback HUD</text>
    </g>
  </g>

  <!-- Right Column: Stylized Control Center Preview Card -->
  <g transform="translate(744, 48)">
    <!-- Outer Popover Shell -->
    <rect width="388" height="344" rx="22" fill="url(#cardGlass)" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="1.2"/>

    <!-- Header -->
    <circle cx="28" cy="30" r="4.5" fill="#3B82F6"/>
    <text x="41" y="34.5" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="14" font-weight="600">SpinMac</text>
    <rect x="110" y="18" width="112" height="23" rx="11.5" fill="#FFFFFF" fill-opacity="0.08"/>
    <text x="166" y="33.5" text-anchor="middle" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="11" font-weight="500">Built-in Display</text>
    <rect x="306" y="18" width="60" height="23" rx="11.5" fill="#FFFFFF" fill-opacity="0.08"/>
    <text x="336" y="33.5" text-anchor="middle" fill="#CBD5E1" font-family="'SF Mono', monospace" font-size="11" font-weight="600">⌃⌥⌘R</text>

    <!-- Pose Stage -->
    <rect x="20" y="56" width="348" height="148" rx="15" fill="#0F172A" fill-opacity="0.58" stroke="#FFFFFF" stroke-opacity="0.08"/>

    <!-- Orbit Ring + Ticks -->
    <circle cx="194" cy="128" r="56" fill="none" stroke="#FFFFFF" stroke-opacity="0.09" stroke-width="1.2"/>
    <circle cx="194" cy="72" r="2.5" fill="#FFFFFF" fill-opacity="0.22"/>
    <circle cx="250" cy="128" r="4.5" fill="#3B82F6"/>
    <circle cx="194" cy="184" r="2.5" fill="#FFFFFF" fill-opacity="0.22"/>
    <circle cx="138" cy="128" r="3.5" fill="#2DD4BF"/>

    <!-- Rotated MacBook Silhouette (270° visual = 90° clockwise) -->
    <g transform="translate(194, 128) rotate(90)">
      <!-- Display Lid -->
      <rect x="-38" y="-36" width="76" height="48" rx="7" fill="url(#screenFill)" stroke="#E2E8F0" stroke-opacity="0.72" stroke-width="1.6"/>
      <rect x="-7" y="-33" width="14" height="3" rx="1.5" fill="#CBD5E1" fill-opacity="0.55"/>
      <!-- Counter-rotated UP label inside lid -->
      <g transform="translate(0, -11) rotate(-90)">
        <path d="M 0 -9 L 0 2 M -4 -5 L 0 -9 L 4 -5" fill="none" stroke="#60A5FA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="0" y="13" text-anchor="middle" fill="#F8FAFC" font-family="-apple-system, sans-serif" font-size="10" font-weight="700">270°</text>
      </g>
      <!-- Lower Deck + Trackpad -->
      <rect x="-38" y="16" width="76" height="24" rx="5" fill="#FFFFFF" fill-opacity="0.06" stroke="#CBD5E1" stroke-opacity="0.42" stroke-width="1.3"/>
      <rect x="-15" y="20" width="30" height="16" rx="3.5" fill="url(#padFill)" stroke="#2DD4BF" stroke-opacity="0.82" stroke-width="1.2"/>
      <g transform="translate(0, 28) rotate(-90)">
        <path d="M 0 -4.5 L 0 4.5 M -3 -1.5 L 0 -4.5 L 3 -1.5" fill="none" stroke="#2DD4BF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>

    <!-- Stage Badge -->
    <rect x="252" y="175" width="104" height="21" rx="10.5" fill="#FFFFFF" fill-opacity="0.08"/>
    <text x="304" y="189" text-anchor="middle" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="600">270° · Synced</text>

    <!-- Display 4-way Segmented Control -->
    <rect x="20" y="218" width="348" height="44" rx="11" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <text x="64" y="244" text-anchor="middle" fill="#CBD5E1" font-family="-apple-system, sans-serif" font-size="13" font-weight="500">0°</text>
    <text x="150" y="244" text-anchor="middle" fill="#CBD5E1" font-family="-apple-system, sans-serif" font-size="13" font-weight="500">90°</text>
    <text x="236" y="244" text-anchor="middle" fill="#CBD5E1" font-family="-apple-system, sans-serif" font-size="13" font-weight="500">180°</text>
    <rect x="282" y="222" width="82" height="36" rx="8.5" fill="#2563EB"/>
    <text x="323" y="244" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="13" font-weight="700">270°</text>

    <!-- Trackpad Mode Row -->
    <rect x="20" y="274" width="348" height="48" rx="11" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <text x="36" y="302" fill="#E2E8F0" font-family="-apple-system, sans-serif" font-size="12.5" font-weight="500">Trackpad Mode</text>
    <rect x="178" y="285" width="176" height="26" rx="7" fill="#FFFFFF" fill-opacity="0.07"/>
    <rect x="181" y="288" width="56" height="20" rx="5.5" fill="#0D9488"/>
    <text x="209" y="301.5" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="600">Linked</text>
    <text x="268" y="301.5" text-anchor="middle" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="500">Indep.</text>
    <text x="326" y="301.5" text-anchor="middle" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="500">Off</text>
  </g>
</svg>
