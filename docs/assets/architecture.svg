<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 370" width="1200" height="370" role="img" aria-label="SpinMac Clean-Room Pipeline Architecture">
  <defs>
    <marker id="arrowDenim" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#4E6B8A"/>
    </marker>
    <marker id="arrowAccent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#E25B2A"/>
    </marker>
    <clipPath id="clipCard1"><rect width="244" height="224" rx="12"/></clipPath>
    <clipPath id="clipCard2A"><rect width="388" height="104" rx="12"/></clipPath>
    <clipPath id="clipCard2B"><rect width="388" height="108" rx="12"/></clipPath>
  </defs>

  <!-- Warm-Paper Ligne Claire Canvas -->
  <rect x="2" y="2" width="1196" height="366" rx="18" fill="#F7F1E5" stroke="#1C1E21" stroke-width="2"/>

  <!-- Header Rule -->
  <line x1="36" y1="80" x2="1164" y2="80" stroke="#1C1E21" stroke-width="1.2" stroke-opacity="0.20"/>

  <!-- Header -->
  <rect x="36" y="26" width="82" height="22" rx="4" fill="#282B30"/>
  <text x="77" y="41" text-anchor="middle" fill="#F7F1E5" font-family="'SF Mono', ui-monospace, monospace" font-size="10.5" font-weight="700" letter-spacing="0.8">PIPELINE</text>
  <text x="132" y="43" fill="#1C1E21" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="20" font-weight="700">SpinMac Clean-Room Architecture</text>
  <text x="36" y="67" fill="#52565E" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12.5">Single state source → dual isolated native engines → 0.0% idle CPU at 0°</text>

  <!-- Corner Tag -->
  <rect x="974" y="26" width="190" height="26" rx="13" fill="#E8C5CE" stroke="#1C1E21" stroke-width="1.5"/>
  <text x="1069" y="43" text-anchor="middle" fill="#1C1E21" font-family="'SF Mono', ui-monospace, monospace" font-size="10.5" font-weight="700">SWIFT 6 · UNIVERSAL</text>

  <!-- Column 1: Single Source of Truth -->
  <g transform="translate(36, 104)">
    <rect x="4" y="4" width="244" height="224" rx="12" fill="#1C1E21" fill-opacity="0.10"/>
    <g clip-path="url(#clipCard1)">
      <rect width="244" height="224" fill="#FFFDF8"/>
      <rect width="244" height="32" fill="#282B30"/>
      <line x1="0" y1="32" x2="244" y2="32" stroke="#1C1E21" stroke-width="1.5"/>
    </g>
    <rect width="244" height="224" rx="12" fill="none" stroke="#1C1E21" stroke-width="1.8"/>

    <text x="16" y="21" fill="#F7F1E5" font-family="'SF Mono', ui-monospace, monospace" font-size="10" font-weight="700" letter-spacing="0.6">01 · STATE COORDINATOR</text>
    <text x="16" y="60" fill="#1C1E21" font-family="-apple-system, sans-serif" font-size="17" font-weight="700">SpinCoordinator</text>
    <line x1="16" y1="74" x2="228" y2="74" stroke="#1C1E21" stroke-width="1" stroke-opacity="0.18"/>

    <text x="16" y="99" fill="#282B30" font-family="'SF Mono', ui-monospace, monospace" font-size="11">• displayAngle: 0|90|180|270</text>
    <text x="16" y="123" fill="#282B30" font-family="'SF Mono', ui-monospace, monospace" font-size="11">• mode: linked | indep | off</text>
    <text x="16" y="147" fill="#282B30" font-family="'SF Mono', ui-monospace, monospace" font-size="11">• independentTrackpadAngle</text>
    <text x="16" y="171" fill="#282B30" font-family="'SF Mono', ui-monospace, monospace" font-size="11">• Hotkey: ⌃⌥⌘R + Tray Menu</text>

    <rect x="16" y="188" width="212" height="22" rx="5" fill="#F7F1E5" stroke="#1C1E21" stroke-width="1.2"/>
    <text x="122" y="203" text-anchor="middle" fill="#3D434D" font-family="'SF Mono', ui-monospace, monospace" font-size="10">Left Popover · Right NSMenu</text>
  </g>

  <!-- Connectors Col 1 -> Col 2 -->
  <path d="M 282 156 L 348 156" fill="none" stroke="#4E6B8A" stroke-width="2.2" marker-end="url(#arrowDenim)"/>
  <path d="M 282 272 L 348 272" fill="none" stroke="#E25B2A" stroke-width="2.2" marker-end="url(#arrowAccent)"/>

  <!-- Column 2A: Display Engine -->
  <g transform="translate(358, 104)">
    <rect x="4" y="4" width="388" height="104" rx="12" fill="#1C1E21" fill-opacity="0.10"/>
    <g clip-path="url(#clipCard2A)">
      <rect width="388" height="104" fill="#EDF2F7"/>
      <rect width="388" height="28" fill="#7B93AC"/>
      <line x1="0" y1="28" x2="388" y2="28" stroke="#1C1E21" stroke-width="1.4"/>
    </g>
    <rect width="388" height="104" rx="12" fill="none" stroke="#1C1E21" stroke-width="1.8"/>

    <text x="16" y="19" fill="#FFFDF8" font-family="'SF Mono', ui-monospace, monospace" font-size="10" font-weight="700" letter-spacing="0.6">02A · DISPLAY ENGINE</text>
    <text x="16" y="54" fill="#1C1E21" font-family="-apple-system, sans-serif" font-size="15.5" font-weight="700">MonitorPanel.framework + CoreGraphics</text>
    <text x="16" y="76" fill="#3D434D" font-family="-apple-system, sans-serif" font-size="12">MPDisplay.setOrientation: · Built-in &amp; External</text>
    <text x="16" y="94" fill="#3C5876" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">Works immediately — no extra permissions required</text>
  </g>

  <!-- Column 2B: Trackpad Engine -->
  <g transform="translate(358, 220)">
    <rect x="4" y="4" width="388" height="108" rx="12" fill="#1C1E21" fill-opacity="0.10"/>
    <g clip-path="url(#clipCard2B)">
      <rect width="388" height="108" fill="#FFF5EE"/>
      <rect width="388" height="28" fill="#E25B2A"/>
      <line x1="0" y1="28" x2="388" y2="28" stroke="#1C1E21" stroke-width="1.4"/>
    </g>
    <rect width="388" height="108" rx="12" fill="none" stroke="#1C1E21" stroke-width="1.8"/>

    <text x="16" y="19" fill="#FFFDF8" font-family="'SF Mono', ui-monospace, monospace" font-size="10" font-weight="700" letter-spacing="0.6">02B · USER-INTERACTIVE RUNLOOP THREAD</text>
    <text x="16" y="55" fill="#1C1E21" font-family="-apple-system, sans-serif" font-size="15.5" font-weight="700">TrackpadEngine + MultitouchMonitor</text>
    <text x="16" y="77" fill="#3D434D" font-family="-apple-system, sans-serif" font-size="12">Dual CGEventTap (HID + Session) · SkyLight / IOKit</text>
    <text x="16" y="96" fill="#B8431B" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">Ref-counted touch leases · External mice untouched</text>
  </g>

  <!-- Connectors Col 2 -> Col 3 -->
  <path d="M 748 156 L 814 156" fill="none" stroke="#4E6B8A" stroke-width="2.2" marker-end="url(#arrowDenim)"/>
  <path d="M 748 274 L 814 274" fill="none" stroke="#E25B2A" stroke-width="2.2" marker-end="url(#arrowAccent)"/>

  <!-- Column 3A: Safety & UX Layer -->
  <g transform="translate(824, 104)">
    <rect x="4" y="4" width="340" height="104" rx="12" fill="#1C1E21" fill-opacity="0.10"/>
    <rect width="340" height="104" rx="12" fill="#FFFDF8" stroke="#1C1E21" stroke-width="1.8"/>
    <rect x="16" y="13" width="114" height="20" rx="4" fill="#7B93AC" fill-opacity="0.22" stroke="#4E6B8A" stroke-width="1.1"/>
    <text x="73" y="27" text-anchor="middle" fill="#2E4761" font-family="'SF Mono', ui-monospace, monospace" font-size="9.5" font-weight="700">SAFETY &amp; UX</text>

    <text x="16" y="56" fill="#1C1E21" font-family="-apple-system, sans-serif" font-size="15.5" font-weight="700">10s Floating Rollback HUD</text>
    <text x="16" y="77" fill="#52565E" font-family="-apple-system, sans-serif" font-size="12">Centered on target screen · Return / Esc</text>
    <text x="16" y="95" fill="#3C5876" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">Auto-reverts if unconfirmed within 10s</text>
  </g>

  <!-- Column 3B: Gesture Parity Output -->
  <g transform="translate(824, 220)">
    <rect x="4" y="4" width="340" height="108" rx="12" fill="#1C1E21" fill-opacity="0.10"/>
    <rect width="340" height="108" rx="12" fill="#FFFDF8" stroke="#1C1E21" stroke-width="1.8"/>
    <rect x="16" y="13" width="152" height="20" rx="4" fill="#E25B2A" fill-opacity="0.15" stroke="#E25B2A" stroke-width="1.1"/>
    <text x="92" y="27" text-anchor="middle" fill="#B8431B" font-family="'SF Mono', ui-monospace, monospace" font-size="9.5" font-weight="700">FULL GESTURE PARITY</text>

    <text x="16" y="56" fill="#1C1E21" font-family="-apple-system, sans-serif" font-size="15.5" font-weight="700">Pointer · Scroll · Swipes · Spaces</text>
    <text x="16" y="77" fill="#52565E" font-family="-apple-system, sans-serif" font-size="12">3-finger drag, inertia, Safari/Finder, Exposé</text>
    <text x="16" y="96" fill="#282B30" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">atexit + willTerminate cursor safety net</text>
  </g>
</svg>
